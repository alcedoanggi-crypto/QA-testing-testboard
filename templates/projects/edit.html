{% extends "base.html" %}
{% block title %}Editar proyecto{% endblock %}
{% block content %}
<div class="card mx-auto max-w-xl p-6">
    <h1 class="mb-4 text-xl font-bold">Editar proyecto</h1>
    <form method="post" class="space-y-3">
        <div><label class="label" for="p-name">Nombre</label>
            <input class="input" id="p-name" name="name" maxlength="120" required value="{{ project.name }}"></div>
        <div><label class="label" for="p-desc">Descripción</label>
            <textarea class="input" id="p-desc" name="description" rows="3">{{ project.description }}</textarea></div>
        <div class="flex justify-end gap-2">
            <a class="btn" href="{{ url_for('views.projects') }}">Cancelar</a>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
